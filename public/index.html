<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧景区运营管理系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">智慧景区</div>
      <nav id="menu"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <span id="page-title">首页</span>
        <div class="user-box">
          <span id="user-info"></span>
          <button id="btn-logout" class="btn btn-sm">退出登录</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <div id="modal-mask" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-head"><span id="modal-title"></span>
        <button id="modal-close" class="modal-close" type="button">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/tourist.js"></script>
  <script src="/js/staff.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
